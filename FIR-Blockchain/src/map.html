<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIR System - Incident Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/web3@latest/dist/web3.min.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --light-color: #ecf0f1;
            --dark-color: #34495e;
            --success-color: #2ecc71;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-color), var(--dark-color));
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://images.unsplash.com/photo-1570044389283-6713aecaac91?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80') no-repeat center center;
            background-size: cover;
            opacity: 0.2;
            z-index: -1;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .logo {
            text-align: center;
            padding: 15px 0;
            background-color: rgba(0, 0, 0, 0.4);
        }
        
        .logo h1 {
            color: var(--light-color);
            font-size: 2rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .logo p {
            color: var(--light-color);
            font-size: 1rem;
            opacity: 0.8;
        }
        
        nav {
            display: flex;
            justify-content: center;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.2);
        }
        
        nav a {
            padding: 10px 20px;
            color: var(--light-color);
            text-decoration: none;
            font-weight: 600;
            margin: 0 10px;
            border-radius: 30px;
            background-color: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }
        
        nav a i {
            margin-right: 8px;
        }
        
        nav a:hover, nav a.active {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        .content {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        
        .map-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease forwards;
            flex: 1;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 190px);
        }
        
        .map-header {
            padding: 15px;
            background-color: var(--primary-color);
            color: var(--light-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .map-header h1 {
            font-size: 1.5rem;
            margin: 0;
            display: flex;
            align-items: center;
        }
        
        .map-header h1 i {
            margin-right: 10px;
        }
        
        .legend {
            margin-top: 5px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        #map {
            width: 100%;
            height: calc(100vh - 150px);
            flex: 1;
            z-index: 1;
        }
        
        .user-info {
            display: flex;
            align-items: center;
        }
        
        #loginStatus {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            margin-left: 10px;
            font-size: 14px;
        }
        
        .custom-marker {
            border: 2px solid white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .logo h1 {
                font-size: 1.6rem;
            }
            
            .logo p {
                font-size: 0.9rem;
            }
            
            .map-header h1 {
                font-size: 1.2rem;
            }
            
            nav a {
                padding: 8px 12px;
                font-size: 13px;
                margin: 0 3px;
            }
            
            #map {
                height: calc(100vh - 130px);
            }
            
            .map-container {
                height: calc(100vh - 160px);
                margin-bottom: 10px;
            }
            
            .content {
                padding: 5px;
            }
        }
        
        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 14px;
        }
        
        .fullscreen-btn i {
            margin-right: 5px;
        }
        
        .fullscreen-map {
            position: fixed !important;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999;
            border-radius: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>FIR System</h1>
            <p>Secure Blockchain-based First Information Reports</p>
        </div>
        
        <nav>
            <a href="map.html" class="active"><i class="fas fa-map-marked-alt"></i> View Map</a>
            <a href="search.html"><i class="fas fa-search"></i> Search FIRs</a>
            <a href="officer.html"><i class="fas fa-user-shield"></i> Login</a>
        </nav>
        
        <div class="content">
            <div class="map-container">
                <div class="map-header">
                    <h1><i class="fas fa-map-marker-alt"></i> FIR Incident Locations</h1>
                    <div class="user-info">
                        <div id="loginStatus"><i class="fas fa-circle"></i> Not Logged In</div>
                    </div>
                </div>
                <div style="position: relative;">
                    <button id="fullscreenBtn" class="fullscreen-btn">
                        <i class="fas fa-expand"></i> Fullscreen
                    </button>
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDVdsoLaGkCQvVvH8x4TYa1g_XMuXYW0K8",
            authDomain: "fir-blockchain-system.firebaseapp.com",
            projectId: "fir-blockchain-system",
            storageBucket: "fir-blockchain-system.appspot.com",
            messagingSenderId: "876211717281",
            appId: "1:876211717281:web:51bc3f0d936a4c6f3c3cc9"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        document.addEventListener('DOMContentLoaded', function() {
            // Check login status using Firebase Auth
            auth.onAuthStateChanged(async function(user) {
                let isOfficerLoggedIn = false;
                let isUserLoggedIn = false;
                let currentUser = null;
                let userRole = null;
                
                if (user) {
                    // User is logged in, get their profile from Firestore
                    try {
                        const userDoc = await db.collection('users').doc(user.uid).get();
                        if (userDoc.exists) {
                            const userData = userDoc.data();
                            currentUser = userData.username;
                            userRole = userData.role;
                            
                            // Set flags based on role
                            if (userData.role === 'officer') {
                                isOfficerLoggedIn = true;
                                // Also set localStorage for compatibility with existing code
                                localStorage.setItem('isOfficerLoggedIn', 'true');
                                localStorage.setItem('userRole', 'officer');
                            } else {
                                isUserLoggedIn = true;
                                // Also set localStorage for compatibility with existing code
                                localStorage.setItem('isUserLoggedIn', 'true');
                                localStorage.setItem('userRole', 'user');
                            }
                            localStorage.setItem('currentUser', currentUser);
                        }
                    } catch (error) {
                        console.error("Error getting user data:", error);
                    }
                } else {
                    // No user is logged in, clear localStorage
                    localStorage.removeItem('isOfficerLoggedIn');
                    localStorage.removeItem('isUserLoggedIn');
                    localStorage.removeItem('userRole');
                    localStorage.removeItem('currentUser');
                }
                
                // Update navigation - Replace login with logout if user is logged in
                if (isOfficerLoggedIn || isUserLoggedIn) {
                    // Find login link and replace it with logout
                    const loginLink = document.querySelector('nav a[href="officer.html"]');
                    if (loginLink) {
                        loginLink.innerHTML = '<i class="fas fa-sign-out-alt"></i> Logout';
                        loginLink.href = "#";
                        loginLink.addEventListener('click', function(e) {
                            e.preventDefault();
                            // Sign out from Firebase
                            auth.signOut().then(() => {
                                // Clear login data
                                localStorage.removeItem("isOfficerLoggedIn");
                                localStorage.removeItem("isUserLoggedIn");
                                localStorage.removeItem("currentUser");
                                localStorage.removeItem("userRole");
                                // Reload page
                                window.location.reload();
                            }).catch((error) => {
                                console.error("Error signing out:", error);
                            });
                        });
                    }
                    
                    // Add "File FIR" link for officers only
                    if (isOfficerLoggedIn) {
                        const navBar = document.querySelector('nav');
                        if (navBar && !document.querySelector('nav a[href="fir-form.html"]')) {
                            const fileFirLink = document.createElement('a');
                            fileFirLink.href = "fir-form.html";
                            fileFirLink.innerHTML = '<i class="fas fa-file-alt"></i> File FIR';
                            // Insert it as the first item
                            if (navBar.firstChild) {
                                navBar.insertBefore(fileFirLink, navBar.firstChild);
                            } else {
                                navBar.appendChild(fileFirLink);
                            }
                        }
                    }
                }
                
                const loginStatus = document.getElementById("loginStatus");
                if (loginStatus) {
                    if (isOfficerLoggedIn) {
                        loginStatus.innerHTML = '<i class="fas fa-circle" style="color: var(--success-color);"></i> Officer: ' + (currentUser || 'Unknown');
                    } else if (isUserLoggedIn) {
                        loginStatus.innerHTML = '<i class="fas fa-circle" style="color: var(--accent-color);"></i> User: ' + (currentUser || 'Unknown');
                    } else {
                        loginStatus.innerHTML = '<i class="fas fa-circle" style="color: #888;"></i> Not Logged In';
                    }
                }
                
                // Initialize map
                let map = L.map('map').setView([20.5937, 78.9629], 5); // Default center is India
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(map);
                
                // Get URL parameters if any
                const urlParams = new URLSearchParams(window.location.search);
                const highlightLocation = urlParams.get('location');
                const highlightFirID = urlParams.get('firID');
                
                // Add legend
                const legend = L.control({position: 'bottomright'});
                legend.onAdd = function (map) {
                    const div = L.DomUtil.create('div', 'info legend');
                    div.innerHTML = `
                        <div style="background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2);">
                            <div style="margin-bottom: 5px; font-weight: bold; color: #333;">Legend</div>
                            <div style="display: flex; align-items: center;">
                                <div style="background: #e74c3c; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; border: 1px solid white;"></div>
                                <span style="color: #333; font-size: 12px;">Incident Locations</span>
                            </div>
                        </div>
                    `;
                    return div;
                };
                legend.addTo(map);
                
                loadFIRsOnMap(map, highlightLocation, highlightFirID);
                
                // Handle fullscreen toggle
                const fullscreenBtn = document.getElementById('fullscreenBtn');
                const mapElement = document.getElementById('map');
                const mapContainer = document.querySelector('.map-container');
                
                fullscreenBtn.addEventListener('click', function() {
                    mapContainer.classList.toggle('fullscreen-map');
                    
                    if (mapContainer.classList.contains('fullscreen-map')) {
                        fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i> Exit';
                        // Notify Leaflet that the map size has changed
                        map.invalidateSize();
                    } else {
                        fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i> Fullscreen';
                        // Notify Leaflet that the map size has changed
                        map.invalidateSize();
                    }
                });
            });
        });
        
        async function getCoordinates(location) {
            const apiKey = '32596d57fca24156ba101b641438eed4'; // OpenCage API key
            const url = `https://api.opencagedata.com/geocode/v1/json?q=${encodeURIComponent(location)}&key=${apiKey}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.results && data.results.length > 0) {
                    return {
                        lat: data.results[0].geometry.lat,
                        lng: data.results[0].geometry.lng
                    };
                }
                return null;
            } catch (error) {
                console.error("Error getting coordinates:", error);
                return null;
            }
        }
        
        async function loadFIRsOnMap(map, highlightLocation, highlightFirID) {
            // Try to get data from the new format first
            const firData = JSON.parse(localStorage.getItem('firData')) || [];
            const markers = [];
            
            if (firData.length > 0) {
                // Use the new format with all details
                for (const fir of firData) {
                    try {
                        // Use stored coordinates if available, otherwise geocode
                        let coords = fir.coordinates;
                        if (!coords) {
                            coords = await getCoordinates(fir.incidentLocation);
                        }
                        
                        if (coords) {
                            const isHighlighted = highlightFirID && fir.firID === highlightFirID;
                            
                            // Create a custom icon with red color for all incident markers
                            const markerIcon = L.divIcon({
                                className: 'custom-marker',
                                html: `<div style="background-color: #e74c3c; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>`,
                                iconSize: [22, 22],
                                iconAnchor: [11, 11]
                            });
                            
                            const marker = L.marker([coords.lat, coords.lng], {
                                icon: markerIcon
                            }).addTo(map);
                            
                            // Add marker to the markers array without a popup
                            markers.push({ marker, isHighlighted, coords });
                        }
                    } catch (error) {
                        console.error("Error processing FIR:", error);
                    }
                }
            } else {
                // Fall back to the old format with limited data
                const firLocations = JSON.parse(localStorage.getItem('firLocations')) || [];
                
                for (const fir of firLocations) {
                    try {
                        // Use stored coordinates if available, otherwise geocode
                        let coords = fir.coordinates;
                        if (!coords) {
                            coords = await getCoordinates(fir.incidentLocation);
                        }
                        
                        if (coords) {
                            const isHighlighted = highlightFirID && fir.firID === highlightFirID;
                            
                            // All markers should be red to represent incident locations
                            const markerIcon = L.divIcon({
                                className: 'custom-marker',
                                html: `<div style="background-color: #e74c3c; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>`,
                                iconSize: [22, 22],
                                iconAnchor: [11, 11]
                            });
                            
                            const marker = L.marker([coords.lat, coords.lng], {
                                icon: markerIcon
                            }).addTo(map);
                            
                            // Add marker to the markers array without a popup
                            markers.push({ marker, isHighlighted, coords });
                        }
                    } catch (error) {
                        console.error("Error processing FIR location:", error);
                    }
                }
            }
            
            // If there's a highlighted FIR, zoom to it
            if (highlightFirID) {
                const highlightedMarker = markers.find(m => m.isHighlighted);
                if (highlightedMarker) {
                    map.setView([highlightedMarker.coords.lat, highlightedMarker.coords.lng], 13);
                }
            } else if (markers.length > 0) {
                // Create a bounds object and fit map to all markers
                const bounds = L.latLngBounds(markers.map(m => [m.coords.lat, m.coords.lng]));
                // Fit the map to these bounds
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }
    </script>
</body>
</html>
